name: Validate and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.15.0
      - name: Determine release intent
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          REF: ${{ github.ref }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          if (!/^\d+\.\d+\.\d+$/.test(pkg.version)) throw new Error('This workflow supports stable versions only');
          if (lock.version !== pkg.version || lock.packages[''].version !== pkg.version) {
            throw new Error('package.json and package-lock.json versions must match');
          }
          let release = false;
          if (process.env.REF === 'refs/heads/main') {
            if (process.env.EVENT_NAME === 'workflow_dispatch') release = true;
            else if (process.env.EVENT_NAME === 'push') {
              const before = process.env.BEFORE_SHA;
              if (!before || /^0+$/.test(before)) throw new Error('Cannot determine previous main version');
              const previous = JSON.parse(execFileSync('git', ['show', `${before}:package.json`], { encoding: 'utf8' }));
              release = previous.version !== pkg.version;
              const old = previous.version.split('.').map(Number);
              const next = pkg.version.split('.').map(Number);
              const difference = next.findIndex((part, i) => part !== old[i]);
              if (release && (difference < 0 || next[difference] < old[difference])) {
                throw new Error('Release version must increase');
              }
            }
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `release=${release}\nversion=${pkg.version}\n`);
          JS
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npm run build
      - name: Pack validated build
        run: |
          mkdir -p release-artifact
          npm pack --ignore-scripts --pack-destination release-artifact
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: release-artifact/*.tgz
          if-no-files-found: error

  release:
    needs: validate
    if: needs.validate.outputs.release == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: npm-release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.15.0
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: release-artifact
      - name: Check whether package version is already published
        id: registry
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${version}`, {
            signal: AbortSignal.timeout(30_000),
          });
          if (response.status !== 200 && response.status !== 404) {
            throw new Error(`npm registry returned HTTP ${response.status}`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `published=${response.status === 200}\n`);
          JS
      - name: Publish validated tarball using npm trusted publishing
        if: steps.registry.outputs.published != 'true'
        run: npm publish release-artifact/*.tgz --access public --ignore-scripts
      - name: Create GitHub release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          # Query failures stop the job; they are not treated as missing releases.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' > /tmp/release-tags
          if grep -Fxq "v$VERSION" /tmp/release-tags; then
            echo "GitHub release v$VERSION already exists."
          else
            gh release create "v$VERSION" --target "$GITHUB_SHA" \
              --title "v$VERSION" --generate-notes
          fi
